name: KiteNative
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: cn.kitlib.kitemac
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  KiteNative:
    type: application
    platform: macOS
    sources:
      - path: KiteNative
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: KiteNative/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: cn.kitlib.kitemac
        PRODUCT_NAME: KiteNative
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: KiteNative/KiteNative.entitlements
    scheme:
      testTargets:
        - KiteNativeUITests
    dependencies:
      - target: KiteWidgetExtension
  KiteNativeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: KiteNativeUITests
    dependencies:
      - target: KiteNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.kitlib.kitemac.uitests
        PRODUCT_NAME: KiteNativeUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KiteNative
        BUNDLE_LOADER: ""
        TEST_HOST: ""
  KiteIOS:
    type: application
    platform: iOS
    sources:
      - path: KiteIOS
        excludes:
          - Info.plist
      - path: Shared/HabitModels.swift
      - path: Shared/HabitSyncModels.swift
      - path: Shared/HabitSyncStoreFactory.swift
      - path: Shared/HabitCoreDataStack.swift
      - path: Shared/HabitCoreDataStore.swift
      - path: Shared/HabitCloudKitSyncMonitor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.kitlib.kiteios
        PRODUCT_NAME: KiteIOS
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KiteIOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_ENTITLEMENTS: KiteIOS/KiteIOS.entitlements
        APS_ENVIRONMENT: development
      configs:
        Release:
          APS_ENVIRONMENT: production
  KiteWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: KiteWidgetExtension
      - path: Shared
        excludes:
          - HabitCloudKitSyncMonitor.swift
    settings:
      base:
        INFOPLIST_FILE: KiteWidgetExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: cn.kitlib.kitemac.widget
        PRODUCT_NAME: KiteWidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
